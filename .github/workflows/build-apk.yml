name: Build Android Debug APK

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
      - 'feat/**'
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Target'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - all
      run_tests:
        description: 'Run Unit and Robolectric Tests'
        required: false
        default: true
        type: boolean
      clean_build:
        description: 'Execute clean before assembling'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Validate APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 2. Repository Pre-Flight Integrity Check
        run: |
          echo "=== REPOSITORY INTEGRITY AUDIT ==="
          echo "Current Branch / Ref: ${{ github.ref }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Workspace Directory: $(pwd)"

          # Check critical configuration files
          for req_file in "build.gradle.kts" "settings.gradle.kts" "app/build.gradle.kts" "gradle/libs.versions.toml"; do
            if [ ! -f "$req_file" ]; then
              echo "::error file=$req_file::Required build configuration file '$req_file' is missing!"
              exit 1
            else
              echo "✓ Found $req_file"
            fi
          done

          # Verify NDK / CMake build configuration
          if [ -f "app/src/main/cpp/CMakeLists.txt" ]; then
            echo "✓ Found app/src/main/cpp/CMakeLists.txt (NDK C++ native engine enabled)"
          else
            echo "::warning::CMakeLists.txt not found at app/src/main/cpp/CMakeLists.txt"
          fi

      - name: 3. Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 4. Setup Android SDK Environment
        uses: android-actions/setup-android@v3

      - name: 5. Cache Android NDK & CMake
        uses: actions/cache@v4
        id: ndk-cache
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
            ${{ env.ANDROID_HOME }}/cmake/3.22.1
          key: android-ndk-26.1.10909125-cmake-3.22.1-${{ runner.os }}

      - name: 6. Dynamically Provision Missing Android SDK, NDK, & CMake
        run: |
          echo "=== DYNAMIC ANDROID SDK / NDK / CMAKE PROVISIONING ==="
          echo "ANDROID_HOME: $ANDROID_HOME"

          # Find sdkmanager
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name "sdkmanager" -type f | head -n 1)
          fi
          echo "Using sdkmanager: $SDKMANAGER"

          # Automatically accept all Google Android licenses
          echo "Accepting Android SDK licenses..."
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          # Install target API platforms, NDK and CMake if missing
          echo "Verifying SDK packages (platforms;android-36, ndk;26.1.10909125, cmake;3.22.1)..."
          PACKAGES_TO_INSTALL=""

          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            PACKAGES_TO_INSTALL="$PACKAGES_TO_INSTALL platforms;android-36"
          fi

          if [ ! -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            PACKAGES_TO_INSTALL="$PACKAGES_TO_INSTALL ndk;26.1.10909125"
          fi

          if [ ! -d "$ANDROID_HOME/cmake/3.22.1" ]; then
            PACKAGES_TO_INSTALL="$PACKAGES_TO_INSTALL cmake;3.22.1"
          fi

          if [ -n "$PACKAGES_TO_INSTALL" ]; then
            echo "Installing missing packages: $PACKAGES_TO_INSTALL"
            yes | "$SDKMANAGER" $PACKAGES_TO_INSTALL
          else
            echo "All required SDK, NDK, and CMake packages are already provisioned!"
          fi

          # Export NDK path for gradle
          if [ -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
            echo "✓ Configured NDK Home: $ANDROID_HOME/ndk/26.1.10909125"
          fi

      - name: 7. Dynamically Prepare Keystore & Environment Secrets
        run: |
          echo "=== PREPARING SECRETS & SIGNING KEYS ==="

          # 1. Prepare .env file (Secrets Gradle plugin requirement)
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
              echo "✓ Generated .env from .env.example"
            else
              touch .env
              echo "✓ Created empty .env"
            fi
          else
            echo "✓ Existing .env found"
          fi

          # 2. Decode or Generate debug.keystore
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "✓ Successfully decoded debug.keystore from repository base64 source"
          elif [ ! -f debug.keystore ]; then
            echo "debug.keystore not found. Generating fresh Android debug keystore..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "✓ Generated fresh debug.keystore via keytool"
          fi

          # Verify debug.keystore is readable
          if keytool -list -keystore debug.keystore -storepass android > /dev/null 2>&1; then
            echo "✓ debug.keystore verified and operational"
          else
            echo "::error::Failed to validate debug.keystore!"
            exit 1
          fi

      - name: 8. Setup & Verify Gradle Wrapper Executable
        run: |
          echo "=== CONFIGURING GRADLE WRAPPER ==="
          if [ ! -f gradlew ]; then
            echo "gradlew script missing, bootstrapping wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: 9. Setup Gradle Dependency & Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          add-job-summary: 'on-failure'

      - name: 10. Run Unit & Robolectric Tests (Optional / Dispatch)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: |
          echo "=== RUNNING UNIT & ROBOLECTRIC TESTS ==="
          ./gradlew testDebugUnitTest --stacktrace --continue

      - name: 11. Clean Workspace (If Requested)
        if: ${{ github.event.inputs.clean_build == 'true' }}
        run: |
          echo "=== PERFORMING CLEAN BUILD ==="
          ./gradlew clean --stacktrace

      - name: 12. Build Android Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          echo "=== BUILDING ANDROID DEBUG APK (assembleDebug) ==="
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 13. Build Android Release APK (If Requested)
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'all' }}
        run: |
          echo "=== BUILDING ANDROID RELEASE APK ==="
          # If release keystore is provided via environment or secrets, build release
          ./gradlew assembleRelease --stacktrace --no-daemon || echo "::warning::Release build skipped or unconfigured signing keys"

      - name: 14. Inspect, Measure, and Package APK Artifacts
        id: package_apk
        run: |
          echo "=== INSPECTING GENERATED APK OUTPUTS ==="
          APK_DIR="app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::Expected APK directory $APK_DIR does not exist!"
            exit 1
          fi

          DEBUG_APK=$(find "$APK_DIR" -name "*.apk" -type f | head -n 1)

          if [ -z "$DEBUG_APK" ] || [ ! -f "$DEBUG_APK" ]; then
            echo "::error::No APK file found in $APK_DIR!"
            exit 1
          fi

          APK_FILE_NAME=$(basename "$DEBUG_APK")
          APK_FILE_SIZE=$(du -h "$DEBUG_APK" | cut -f1)
          APK_FILE_BYTES=$(wc -c < "$DEBUG_APK")
          APK_SHA256=$(sha256sum "$DEBUG_APK" | cut -d ' ' -f 1)

          echo "Found APK: $DEBUG_APK"
          echo "File Name: $APK_FILE_NAME"
          echo "Size: $APK_FILE_SIZE ($APK_FILE_BYTES bytes)"
          echo "SHA-256: $APK_SHA256"

          # Create a structured directory for artifacts
          mkdir -p artifacts/apk
          FINAL_NAME="NativeBenchmark-debug-${{ github.ref_name }}-${{ github.run_number }}.apk"
          # sanitize final name (replace slashes with dashes)
          FINAL_NAME=$(echo "$FINAL_NAME" | tr '/' '-')
          cp "$DEBUG_APK" "artifacts/apk/$FINAL_NAME"

          echo "apk_path=artifacts/apk/$FINAL_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$FINAL_NAME" >> $GITHUB_OUTPUT
          echo "apk_size=$APK_FILE_SIZE" >> $GITHUB_OUTPUT
          echo "apk_sha256=$APK_SHA256" >> $GITHUB_OUTPUT

      - name: 15. Upload Debug APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-run-${{ github.run_number }}
          path: artifacts/apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 16. Publish GitHub Actions Summary Report
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 🚀 Android Debug APK Build Report

          | Metric | Value |
          |:---|:---|
          | **Status** | ✅ **SUCCESSFUL** |
          | **Artifact Name** | `${{ steps.package_apk.outputs.apk_name }}` |
          | **File Size** | **${{ steps.package_apk.outputs.apk_size }}** |
          | **SHA-256 Checksum** | `${{ steps.package_apk.outputs.apk_sha256 }}` |
          | **Git Reference** | `${{ github.ref }}` |
          | **Commit SHA** | `${{ github.sha }}` |
          | **Build Number** | `${{ github.run_number }}` |
          | **NDK Engine** | C++17 (ARM64-v8a, x86_64) |

          ### 📲 How to Download & Install
          1. Go to the **Summary** tab of this GitHub Actions run.
          2. Scroll to the **Artifacts** section at the bottom.
          3. Download **`debug-apk-run-${{ github.run_number }}`**.
          4. Unzip the downloaded file and transfer the `.apk` file to your Android device.
          5. Install with ADB: `adb install -r ${{ steps.package_apk.outputs.apk_name }}`
          EOF

      - name: 17. Automatic GitHub Release Deployment (On Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/apk/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 18. Build Failure Diagnostic Dump
        if: failure()
        run: |
          echo "=== BUILD DIAGNOSTICS & SYSTEM LOGS ==="
          echo "Gradle build failed. Dumping diagnostic details..."
          if [ -d "app/build/reports" ]; then
            echo "Found build reports directory. Checking test failures:"
            find app/build/reports -type f | head -n 30
          fi
          echo "Disk space remaining:"
          df -h
          echo "Memory status:"
          free -m
